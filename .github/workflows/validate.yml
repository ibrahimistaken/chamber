name: Validate Lists & Catalog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Schema, Catalog & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate lists and generate index.json
        run: pnpm run build:catalog

      - name: Verify index.json is up to date
        run: |
          if ! git diff --exit-code index.json; then
            echo "::error::index.json güncel değil. Lütfen 'pnpm build:catalog' çalıştırıp index.json'u commitle."
            exit 1
          fi

      - name: Typecheck
        run: pnpm run compile

      - name: Run unit tests
        run: pnpm test
